name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Open MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes openmpi-bin libopenmpi-dev
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify MPI runtime
        run: |
          mpiexec --version
          python -c "from mpi4py import MPI; print('MPI vendor:', MPI.get_vendor()); print(MPI.Get_library_version())"
      - name: Compile Python sources
        run: python -m compileall -q src practicals tests
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Run all MPI practicals
        run: |
          mpiexec --oversubscribe -n 4 python practicals/practical_01_process_rank_size.py
          mpiexec --oversubscribe -n 4 python practicals/practical_02_send_receive.py
          mpiexec --oversubscribe -n 4 python practicals/practical_03_array_distribution.py --length 11
          mpiexec --oversubscribe -n 4 python practicals/practical_04_parallel_array_sum.py --length 11
          mpiexec --oversubscribe -n 4 python practicals/practical_05_parallel_matrix_addition.py --rows 5 --columns 3
          mpiexec --oversubscribe -n 4 python practicals/practical_06_parallel_matrix_multiplication.py --rows-a 5 --shared 3 --columns-b 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript
        run: |
          node --check web/public/script.js
          node --check web/public/presentation.js
