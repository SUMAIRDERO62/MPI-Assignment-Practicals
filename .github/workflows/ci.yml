name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Open MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes openmpi-bin libopenmpi-dev
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify MPI runtime
        run: |
          mpiexec --version
          python -c "from mpi4py import MPI; print('MPI vendor:', MPI.get_vendor()); print(MPI.Get_library_version())"
      - name: Compile Python sources
        run: python -m compileall -q src practicals tests
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
